[project]
name = "outlook-desktop-mcp-plus"
version = "0.4.1"
description = "Maintained fork of outlook-desktop-mcp: Outlook Desktop as an MCP server — Windows (COM) and macOS (AppleScript). No Graph API, no Entra app registration — just your local Outlook."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alexander Rolli" },
]
keywords = ["mcp", "outlook", "email", "com", "applescript", "automation", "windows", "macos", "microsoft", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pywin32>=310; sys_platform == 'win32'",
    "mcp[cli]>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/lord-helicon/outlook-desktop-mcp-plus"
Repository = "https://github.com/lord-helicon/outlook-desktop-mcp-plus"
Issues = "https://github.com/lord-helicon/outlook-desktop-mcp-plus/issues"

[project.scripts]
outlook-desktop-mcp-plus = "outlook_desktop_mcp.entrypoint:main"
# Same command name as upstream, so existing MCP client configs keep working.
outlook-desktop-mcp = "outlook_desktop_mcp.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_desktop_mcp"]
