name: Publish to PyPI

# Publishes the fork as outlook-desktop-mcp-plus. Runs only when triggered by
# hand (Actions > Publish to PyPI > Run workflow), never on push. Uses PyPI
# trusted publishing: the project must have this repo, this workflow file
# (publish.yml) and the "main" environment registered as a (pending)
# trusted publisher on pypi.org before the first run.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
