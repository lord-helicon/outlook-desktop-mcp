name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run pure unit tests
        # Live-Outlook tests (phase1_com, phase3_mcp, calendar_*, extras_*) are
        # intentionally excluded. Missing files are skipped.
        run: |
          status=0
          for t in date_literal_test mac_batch_test com_bridge_test formatting_test mac_ui_fallback_test; do
            f="tests/$t.py"
            if [ -f "$f" ]; then
              echo "::group::$f"
              python "$f" || status=1
              echo "::endgroup::"
            else
              echo "skipping missing $f"
            fi
          done
          exit $status
